<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amaka Hub | Premium Family Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030304;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-pink: #ec4899;
            --accent-orange: #f59e0b;
            --glass-blur: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-title h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, rgba(255,255,255,0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto;
            gap: 20px;
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .bento-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.15);
        }

        /* Specific Sizes */
        .card-wide { grid-column: span 2; }
        .card-full { grid-column: span 4; }
        .card-tall { grid-row: span 2; }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title svg {
            width: 20px;
            height: 20px;
            opacity: 0.8;
        }

        /* Family Section */
        .family-list {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .family-item {
            text-align: center;
            min-width: 80px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--card-border);
            font-size: 1.5rem;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* Items List */
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .list-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .list-item .time {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-left: auto;
        }

        /* Shopping */
        .shopping-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--card-border);
            border-radius: 6px;
            cursor: pointer;
        }

        .checkbox.checked {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            position: relative;
        }

        .checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: white;
        }

        /* Pi Status */
        .pi-metrics {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-blue);
            width: 0%;
            transition: width 1s ease-in-out;
        }

        @media (max-width: 900px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .card-full { grid-column: span 2; }
        }

        @media (max-width: 600px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }
            .card-wide, .card-full { grid-column: span 1; }
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>Amaka Hub</h1>
                <p id="last-sync">Connecting to your server...</p>
            </div>
        </header>

        <main class="bento-grid">
            <!-- Family Card -->
            <section class="bento-card card-full">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Family Status
                </div>
                <div class="family-list" id="family-list">
                    <!-- Dynamic Content -->
                </div>
            </section>

            <!-- Calendar Card -->
            <section class="bento-card card-wide">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    Upcoming Events
                </div>
                <div id="events-list">
                    <!-- Dynamic Content -->
                </div>
            </section>

            <!-- Pi Status Card -->
            <section class="bento-card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                    Server Health
                </div>
                <div class="pi-metrics" id="pi-status">
                    <!-- Dynamic Content -->
                </div>
            </section>

            <!-- Note Card -->
            <section class="bento-card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    Shared Note
                </div>
                <p id="secure-note" style="font-size: 0.9rem; line-height: 1.6; color: var(--text-secondary);">
                    Loading secure data...
                </p>
            </section>

            <!-- Shopping Card -->
            <section class="bento-card card-full">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    Shopping List
                </div>
                <div id="shopping-list">
                    <!-- Dynamic Content -->
                </div>
            </section>
        </main>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                renderUI(data);
                document.getElementById('last-sync').innerText = 'System online • Updated just now';
            } catch (err) {
                console.error('Failed to fetch data', err);
                document.getElementById('last-sync').innerText = 'System offline • Check connection';
            }
        }

        function renderUI(data) {
            // Render Family
            const familyList = document.getElementById('family-list');
            familyList.innerHTML = data.family.map(m => `
                <div class="family-item">
                    <div class="avatar">${m.name[0]}</div>
                    <div style="font-weight: 600; margin-bottom: 4px;">${m.name}</div>
                    <div class="status-badge">${m.status || 'Unknown'}</div>
                </div>
            `).join('');

            // Render Events
            const eventsList = document.getElementById('events-list');
            eventsList.innerHTML = data.events.map(e => {
                const date = new Date(e.date);
                return `
                    <div class="list-item">
                        <div class="dot" style="background: var(--accent-pink)"></div>
                        <span>${e.title}</span>
                        <span class="time">${date.toLocaleDateString()}</span>
                    </div>
                `;
            }).join('') || '<p style="color: var(--text-secondary)">No upcoming events</p>';

            // Render Pi Status
            const piStatus = document.getElementById('pi-status');
            const pi = data.pi || {cpuUsage: 0, storageUsage: 0, tailscaleConnected: false};
            piStatus.innerHTML = `
                <div class="metric">
                    <div class="metric-header">
                        <span>CPU Usage</span>
                        <span>${Math.round(pi.cpuUsage * 100)}%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${pi.cpuUsage * 100}%"></div></div>
                </div>
                <div class="metric">
                    <div class="metric-header">
                        <span>Storage</span>
                        <span>${Math.round(pi.storageUsage * 100)}%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${pi.storageUsage * 100}%; background: var(--accent-green)"></div></div>
                </div>
                <div style="font-size: 0.8rem; display: flex; align-items: center; gap: 6px; margin-top: 5px;">
                    <div style="width: 8px; height: 8px; border-radius: 50%; background: ${pi.tailscaleConnected ? 'var(--accent-green)' : 'red'}"></div>
                    ${pi.tailscaleConnected ? 'Tailscale Connected' : 'Tailscale Disconnected'}
                </div>
            `;

            // Render Note
            document.getElementById('secure-note').innerText = data.note ? data.note.content : 'No note available';

            // Render Shopping
            const shoppingList = document.getElementById('shopping-list');
            shoppingList.innerHTML = data.shopping.map(s => `
                <div class="shopping-item">
                    <div class="checkbox ${s.completed ? 'checked' : ''}"></div>
                    <span style="${s.completed ? 'text-decoration: line-through; opacity: 0.5' : ''}">${s.title}</span>
                </div>
            `).join('');
        }

        // Poll for updates
        setInterval(fetchData, 5000);
        fetchData();
    </script>
</body>
</html>
